name: Build & Release

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Read version
        id: version
        run: |
          tag=$(grep '^VERSION_TAG=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          name=$(grep '^VERSION_NAME=' version.properties | cut -d= -f2 | tr -d '[:space:]')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up signing key (optional secret)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            {
              echo "MATHONG_KEYSTORE=$RUNNER_TEMP/release.jks"
              echo "MATHONG_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
              echo "MATHONG_KEY_ALIAS=$KEY_ALIAS"
              echo "MATHONG_KEY_PASSWORD=$KEY_PASSWORD"
            } >> "$GITHUB_ENV"
            echo "Using keystore from secrets"
          else
            echo "No KEYSTORE_BASE64 secret; using the bundled keystore"
          fi

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build APKs
        run: ./gradlew :app:assembleRelease :app:assembleDebug --stacktrace

      - name: Collect APKs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/Mathong-${{ steps.version.outputs.tag }}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/Mathong-${{ steps.version.outputs.tag }}-debug.apk"
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: Mathong-${{ steps.version.outputs.tag }}-${{ github.run_number }}
          path: dist/*.apk

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests

      - name: Create tag and release
        if: >-
          github.event_name != 'pull_request' &&
          steps.version.outputs.exists == 'false' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Mathong ${{ steps.version.outputs.tag }} (${{ steps.version.outputs.name }})
          body_path: RELEASE_NOTES.md
          files: dist/*.apk
          make_latest: true
